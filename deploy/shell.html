<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Yes, Captain!</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #f2e2c0; color: #1d1712; overflow: hidden; touch-action: none;
	font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Comic Sans MS", Verdana, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
	background: radial-gradient(ellipse at center, #f7ead0 0%, #f2e2c0 55%, #d4b985 130%); text-align: center; }
#card { border: 6px solid #1d1712; border-radius: 26px 18px 30px 16px; background: #fbf2dc; padding: 28px 44px 30px;
	box-shadow: 8px 9px 0 #1d1712; max-width: 80vw; transform: rotate(-1deg); }
h1 { margin: 0; font-size: clamp(34px, 7vw, 76px); letter-spacing: 1px; color: #c9413a;
	text-shadow: 3px 3px 0 #1d1712, -2px -2px 0 #1d1712, 2px -2px 0 #1d1712, -2px 2px 0 #1d1712, 0 6px 0 #1d1712; }
h2 { margin: 6px 0 22px; font-size: clamp(13px, 2vw, 20px); letter-spacing: 2px; }
#bar { height: 26px; border: 5px solid #1d1712; border-radius: 16px; background: #e3cd9f; overflow: hidden; }
#fill { height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, #e2a93b 0 14px, #e07b39 14px 28px); transition: width .2s; }
#quip { margin-top: 16px; font-size: clamp(14px, 2vw, 20px); min-height: 2.6em; }
#quip b { color: #c9413a; }
#status-notice { display: none; margin-top: 14px; padding: 10px 14px; border: 4px solid #c9413a; border-radius: 12px; background: #fff; }
/* a real text box for phones: the game's own boxes can't call up an on-screen keyboard */
#ycask { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center;
	background: rgba(29, 23, 18, 0.55); touch-action: auto; padding-top: 12vh; }
#ycask form { border: 5px solid #1d1712; border-radius: 22px 16px 24px 14px; background: #fbf2dc; padding: 16px 18px 18px;
	box-shadow: 6px 7px 0 #1d1712; width: min(92vw, 460px); box-sizing: border-box; }
#ycask label { display: block; font-size: 20px; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px; }
#ycask .row { display: flex; gap: 10px; }
#ycask input { flex: 1; min-width: 0; font: inherit; font-size: 22px; padding: 10px 12px; border: 4px solid #1d1712;
	border-radius: 12px; background: #fffaf0; color: #1d1712; }
#ycask button { font: inherit; font-size: 20px; font-weight: bold; padding: 0 18px; border: 4px solid #1d1712; border-radius: 12px;
	background: #6f9a4a; color: #fffaf0; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Yes, Captain! needs JavaScript.</noscript>
<div id="status">
	<div id="card">
		<h1>YES, CAPTAIN!</h1>
		<h2>A BRIDGE SIMULATOR FOR LOUD FRIENDS</h2>
		<div id="bar"><div id="fill"></div></div>
		<div id="quip"><b>IGOR:</b> Loading ship. Please do not touch anything. Especially you.</div>
		<div id="status-notice"></div>
	</div>
</div>
<script src="config.js"></script>
<script>
// Browsers only run the game in a "secure context": https, or localhost. And the game's live connection
// only works where the browser fully trusts the certificate. So every visitor is sent to the server's
// home address (YC_HOME, set by the container) when there is one, and from plain http to https anyway.
window.YC_BLOCKED = false;
(function () {
	var home = window.YC_HOME || '';
	var target = '';
	var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
	if (home && location.origin !== home && !local) {
		target = home + location.pathname + location.search;
	} else if (!window.isSecureContext && window.YC_HTTPS_PORT) {
		target = 'https://' + location.hostname + ':' + window.YC_HTTPS_PORT + location.pathname + location.search;
	}
	if (!target && window.isSecureContext) { return; }
	window.YC_BLOCKED = true;
	if (target && window.isSecureContext) {
		// already on https, just the wrong name: go straight there
		location.replace(target);
		return;
	}
	document.addEventListener('DOMContentLoaded', function () {
		var q = document.getElementById('quip');
		var n = document.getElementById('status-notice');
		document.getElementById('bar').style.display = 'none';
		n.style.display = 'block';
		if (target) {
			q.innerHTML = '<b>IGOR:</b> Wrong door. Browsers insist on the https one. IGOR is taking you there.';
			n.innerHTML = 'Going to <a href="' + target + '">' + target + '</a>.';
			setTimeout(function () { location.replace(target); }, 1500);
		} else {
			q.innerHTML = '<b>IGOR:</b> Browsers only run this game over https. This server has none set up.';
			n.textContent = 'Set TLS_HOST, LAN_IP or PUBLIC_HOST on the container, then use the https address.';
		}
	});
}());
</script>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	if (window.YC_BLOCKED) { return; }
	const overlay = document.getElementById('status');
	const fill = document.getElementById('fill');
	const quip = document.getElementById('quip');
	const notice = document.getElementById('status-notice');
	const QUIPS = [
		'Loading ship. Please do not touch anything. Especially you.',
		'Inflating the captain. This takes a while.',
		'Counting the crew. IGOR keeps getting a low number.',
		'Warming up the engines. Not that warm. Stop.',
		'Feeding Pudding. Pudding is also feeding on a cable.',
		'Untangling the wheel from the throttle. Again.',
		'IGOR is drawing every line by hand. IGOR has no hands.',
		'Almost ready. This is a lie robots tell.',
	];
	let qi = 0;
	const timer = setInterval(() => {
		qi = (qi + 1) % QUIPS.length;
		quip.innerHTML = '<b>IGOR:</b> ' + QUIPS[qi];
	}, 2600);
	function fail(err) {
		console.error(err);
		clearInterval(timer);
		notice.style.display = 'block';
		notice.textContent = (err && err.message) ? err.message : String(err);
		quip.innerHTML = '<b>IGOR:</b> Something broke before the ship even started. A new record.';
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing: ' + missing.join(', '));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) { fill.style.width = Math.round(100 * current / total) + '%'; }
		},
	}).then(() => { clearInterval(timer); overlay.remove(); }, fail);
}());
</script>
<script>
// YCAsk(title, value, maxLength, done): a native text box over the game, so phones get their keyboard.
// done(text, submitted) is called once: submitted is false when the player taps outside to cancel.
window.YCAsk = function (title, value, max, done) {
	var old = document.getElementById('ycask');
	if (old) { old.remove(); }
	var wrap = document.createElement('div');
	wrap.id = 'ycask';
	var form = document.createElement('form');
	var label = document.createElement('label');
	label.textContent = title;
	var row = document.createElement('div');
	row.className = 'row';
	var input = document.createElement('input');
	input.type = 'text';
	input.value = value || '';
	input.autocomplete = 'off';
	input.setAttribute('autocapitalize', 'words');
	input.setAttribute('enterkeyhint', 'done');
	if (max > 0) { input.maxLength = max; }
	var ok = document.createElement('button');
	ok.type = 'submit';
	ok.textContent = 'OK';
	row.appendChild(input);
	row.appendChild(ok);
	form.appendChild(label);
	form.appendChild(row);
	wrap.appendChild(form);
	var finished = false;
	function finish(submitted) {
		if (finished) { return; }
		finished = true;
		var v = input.value;
		wrap.remove();
		var c = document.getElementById('canvas');
		if (c) { c.focus(); }
		done(submitted ? v : (value || ''), submitted);
	}
	form.addEventListener('submit', function (e) { e.preventDefault(); finish(true); });
	wrap.addEventListener('pointerdown', function (e) { if (e.target === wrap) { e.preventDefault(); finish(true); } });
	// keep the game from hearing these keys
	['keydown', 'keyup', 'keypress'].forEach(function (k) { form.addEventListener(k, function (e) { e.stopPropagation(); }); });
	document.body.appendChild(wrap);
	input.focus();
	try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
};
</script>
<script>
// Keep the screen awake while the game is open: a phone that dims and locks during a briefing drops its connection.
// Browsers only grant this to a visible page, after the player has touched it, so ask then, and again on coming back.
(function () {
	if (!('wakeLock' in navigator)) { return; }
	var lock = null;
	function want() {
		if (lock !== null || document.visibilityState !== 'visible') { return; }
		navigator.wakeLock.request('screen').then(function (l) {
			lock = l;
			l.addEventListener('release', function () { lock = null; });
		}).catch(function () {});
	}
	['pointerdown', 'keydown', 'touchend'].forEach(function (k) { document.addEventListener(k, want, { passive: true }); });
	document.addEventListener('visibilitychange', want);
}());
</script>
<script src="voice.js"></script>
</body>
</html>
